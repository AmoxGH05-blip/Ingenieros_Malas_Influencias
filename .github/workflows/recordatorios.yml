name: Recordatorios de evaluacion (SCRUM-40)

# Todos los dias a las 15:00 UTC (09:00 hora de Ciudad de Mexico) llama al backend para que mande
# los avisos de 7 / 3 / 1 dias antes del cierre. Al tocar la API y la base de datos cada dia, tambien
# despierta a Render y evita que Supabase (plan gratuito) se pause por inactividad.
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      simular:
        description: "Solo simular: lista a quien le tocaria, sin enviar correos"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  recordatorios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BACKEND_URL: ${{ vars.BACKEND_URL || 'https://dygsis-backend.onrender.com' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      # En ejecucion programada no existe el input: se envia de verdad. A mano, el valor por defecto simula.
      SIMULAR: ${{ github.event_name == 'workflow_dispatch' && inputs.simular || 'false' }}
    steps:
      - name: Comprobar configuracion
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta el secret CRON_SECRET en Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Despertar el backend (Render gratuito se duerme)
        run: curl -fsS --max-time 120 --retry 5 --retry-delay 15 --retry-all-errors "$BACKEND_URL/api/health"

      - name: Ejecutar recordatorios
        shell: bash
        run: |
          set -euo pipefail
          # Sin reintentos del POST: si la primera llamada sigue viva en el servidor, repetirla solo crea
          # corridas concurrentes. Los avisos que fallen se reintentan en la corrida de manana.
          curl -fsS --max-time 300 -o resultado.json             -X POST -H "x-cron-secret: $CRON_SECRET"             "$BACKEND_URL/api/admin/recordatorios/ejecutar?simular=$SIMULAR"
          # Solo conteos: el JSON trae correos de alumnos y los logs de Actions pueden ser publicos.
          jq '{simulacion, periodos: [.periodos[] | {nombre, diasRestantes, umbral, enviados, omitidosYaEnviado, omitidosSinPendientes, porEnviar: (.destinatarios | length), fallidos: (.fallidos | length)}]}' resultado.json

      - name: Fallar si algun correo no salio
        shell: bash
        run: |
          set -euo pipefail
          fallidos=$(jq '[.periodos[].fallidos | length] | add // 0' resultado.json)
          if [ "$fallidos" -gt 0 ]; then
            echo "::error::$fallidos correo(s) no se pudieron enviar. Revisa SMTP_USER/SMTP_PASSWORD en Render y los logs del backend."
            exit 1
          fi
